[project]
name = "optimization-service"
version = "0.1.0"
description = "AI + Optimization Service: consumes Kafka events, runs Shadow Finder + optimizer, writes Plans."
requires-python = ">=3.11"
dependencies = [
    "aiokafka>=0.10",
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",
    "ortools>=9.9",
    "lightgbm>=4.3",
    "scikit-learn>=1.4",
    "shap>=0.45",
    "joblib>=1.3",
    "pandas>=2.2",
    "numpy>=1.26",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
