[project]
name = "contracts"
version = "0.1.0"
description = "Shared Kafka event contracts: Pydantic models + JSON Schemas (single source of truth for the event bus, per architecture Section 15)."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
