services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://blockplanner:blockplanner@postgres:5432/blockplanner
      SOLVE_TIME_LIMIT: "60"
      MODEL_PATH: models/priority_classifier.joblib
    volumes:
      - ./src:/app/src
      - ./models:/app/models
      - ./scripts:/app/scripts
    depends_on:
      - postgres

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: blockplanner
      POSTGRES_PASSWORD: blockplanner
      POSTGRES_DB: blockplanner
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
