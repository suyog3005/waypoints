[project]
name = "db"
version = "0.1.0"
description = "Shared SQLAlchemy models + Alembic migrations (single source of truth for the Operational DB schema)."
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg2-binary>=2.9",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
